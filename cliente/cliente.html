<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1f2933">
  <title>Cliente · El Pistón</title>
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/estilos.css">
  <script type="module" src="js/paginas/cliente.js"></script>
</head>
<body>
  <div class="app">
    <header class="barra" id="barra"></header>
    <nav class="menu" id="menu" aria-label="Navegación principal"></nav>

    <main class="contenido">
      <section class="encabezado">
        <div class="encabezado__texto">
          <a href="clientes.html" class="migas">← Clientes</a>
          <h1 id="nombre-cliente">Cliente</h1>
          <p id="contacto-cliente"></p>
        </div>
        <div class="acciones">
          <button type="button" class="boton boton--secundario" id="boton-editar">Editar datos</button>
          <button type="button" class="boton" id="boton-vehiculo">Agregar vehículo</button>
        </div>
      </section>

      <section class="kpis" id="kpis-cliente"></section>

      <div class="rejilla rejilla--dos">
        <section class="tarjeta">
          <div class="tarjeta__titulo">
            <h2>Vehículos</h2>
          </div>
          <div id="lista-vehiculos"></div>
        </section>

        <section class="tarjeta">
          <div class="tarjeta__titulo">
            <div>
              <h2>Historial de servicios</h2>
              <p>Todas las órdenes del cliente</p>
            </div>
          </div>
          <div id="historial"></div>
        </section>
      </div>
    </main>
  </div>

  <dialog class="dialogo" id="dialogo-cliente" aria-labelledby="titulo-dialogo-cliente">
    <form id="formulario-cliente" class="formulario" novalidate>
      <div class="dialogo__cabecera">
        <h2 id="titulo-dialogo-cliente">Editar cliente</h2>
        <button type="button" class="cerrar" data-cerrar aria-label="Cerrar">×</button>
      </div>
      <label class="campo">
        Nombre completo
        <input type="text" name="nombre" required minlength="2" maxlength="120" autocomplete="name">
      </label>
      <label class="campo">
        Teléfono
        <input type="tel" name="telefono" required pattern="[0-9+ \(\)\-]{6,20}" autocomplete="tel">
      </label>
      <label class="campo">
        Dirección
        <input type="text" name="direccion" maxlength="250" placeholder="Opcional">
      </label>
      <p class="formulario__error" aria-live="assertive"></p>
      <div class="dialogo__acciones">
        <button type="button" class="boton boton--secundario" data-cerrar>Cancelar</button>
        <button type="submit" class="boton">Guardar cambios</button>
      </div>
    </form>
  </dialog>

  <dialog class="dialogo" id="dialogo-vehiculo" aria-labelledby="titulo-dialogo-vehiculo">
    <form id="formulario-vehiculo" class="formulario formulario--doble" novalidate>
      <div class="dialogo__cabecera campo--completo">
        <h2 id="titulo-dialogo-vehiculo">Nuevo vehículo</h2>
        <button type="button" class="cerrar" data-cerrar aria-label="Cerrar">×</button>
      </div>
      <label class="campo">
        Matrícula
        <input type="text" name="matricula" required pattern="[A-Za-z0-9\- ]{4,12}" placeholder="P123456" autocapitalize="characters">
      </label>
      <label class="campo">
        Año
        <input type="number" name="anio" required min="1940" max="2100" step="1" inputmode="numeric">
      </label>
      <label class="campo">
        Marca
        <input type="text" name="marca" required maxlength="60" placeholder="Lada, Moskvich, Peugeot…">
      </label>
      <label class="campo">
        Modelo
        <input type="text" name="modelo" required maxlength="60">
      </label>
      <label class="campo campo--completo">
        Kilometraje actual
        <input type="number" name="kilometraje" min="0" step="1" inputmode="numeric" placeholder="Opcional">
      </label>
      <p class="formulario__error" aria-live="assertive"></p>
      <div class="dialogo__acciones">
        <button type="button" class="boton boton--secundario" data-cerrar>Cancelar</button>
        <button type="submit" class="boton">Guardar vehículo</button>
      </div>
    </form>
  </dialog>

  <div class="avisos" id="avisos" aria-live="polite"></div>
</body>
</html>
